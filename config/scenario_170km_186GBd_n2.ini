# Scenario 2: 170 km single span, 186 GBaud, n=2.
# Higher baud rate (4x bandwidth): heavier NLPR filters.
[system parameters]
span length [km] = 170
alpha [dB/km] = 0.2
D [ps/nm/km] = 17
gamma [1/W/km] = 1.27
amplifier noise figure [dB] = 4.5
number of polarizations = 2
number of spans = 1
symbol rate [Gbaud] = 186
modulation = 64-QAM
RRC roll-off = 0.05
RRC delay = 510
data symbols per block = 262144
low-pass filter bandwidth [GHz] = 200
analog oversampling = 7
digital oversampling = 2
number of channels = 5
channel spacing [GHz] = 200
[L-ESSFM parameters]
step size method = linear
split step method = symmetric
combine half-steps = yes
steps per span = 3
optimize lengths = yes
tied Kerr parameters = no
nl filter length = 66
# nl alpha: at TEST/apply time this MUST be 1 (the saved NLPR filter is already
#   the physical filter = trained_var/nl_alpha_train). During TRAINING a larger
#   value (e.g. 15) better conditions the gradients (rebalances variable scales);
#   the training step sets it internally. Do NOT set this to the training value here.
nl alpha = 1.0
[training]
minibatch size = 100
optimizer = adam
summary writing interval = 100
save results to file = yes
[data generation]
forward steps per span = 3200
number of queue elements = 50000
generation batch size = 10
number of parallel processors = 24
data replication factor = 150
minimum elements after dequeue = 2000
forward step size method = logarithmic
forward split step method = symmetric
training power [dBm] = 13.0
