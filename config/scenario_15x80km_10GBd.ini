# Scenario 6: 15 x 80 km long-haul, 10 GBaud, n=1.125 (digital os).
# Low-rate member of the 15 x 80 km family (10 / 32 / 93 GBaud share this link),
# so the three scenarios give a clean SNR-vs-symbol-rate comparison.
#
# The forward was generated by Dario in ~/ldbp2 (forward_resultsMAX10.npy, copied
# to forward/forward_scenario_15x80km_10GBd.npy): 20 powers, arange(-6, -4, 0.1)
# dBm, one realization each, after a coarse arange(-8, -2, 1) dBm sweep.
[system parameters]
span length [km] = 80
alpha [dB/km] = 0.2
D [ps/nm/km] = 17
gamma [1/W/km] = 1.27
amplifier noise figure [dB] = 4.5
number of polarizations = 2
number of spans = 15
symbol rate [Gbaud] = 10
modulation = 64-QAM
RRC roll-off = 0.05
RRC delay = 510
data symbols per block = 262144
low-pass filter bandwidth [GHz] = 11
analog oversampling = 7
digital oversampling = 1.125
number of channels = 5
channel spacing [GHz] = 11
[L-ESSFM parameters]
step size method = linear
split step method = symmetric
combine half-steps = yes
steps per span = 3
optimize lengths = yes
tied Kerr parameters = no
# Floor value only: the trainer derives the per-Ns length from nlpr_length(),
# which gives 12 at Ns=1 and 4 from Ns=15 on (at 10 GBaud the kernel is ~1 tap).
nl filter length = 5
# nl alpha: at TEST/apply time this MUST be 1 (the saved NLPR filter is already
#   the physical filter = trained_var/nl_alpha_train). During TRAINING a larger
#   value (e.g. 15) better conditions the gradients (rebalances variable scales);
#   the training step sets it internally. Do NOT set this to the training value here.
nl alpha = 1.0
[training]
minibatch size = 100
optimizer = adam
summary writing interval = 100
save results to file = yes
[data generation]
# Dario's value for this scenario. Verified converged on the same link and rate:
# 25, 50 and 100 steps/span give the same SNR to 0.003 dB.
forward steps per span = 20
number of queue elements = 50000
generation batch size = 10
number of parallel processors = 24
data replication factor = 150
minimum elements after dequeue = 2000
forward step size method = logarithmic
forward split step method = symmetric
# Coarse sweep: EDC peaks at -6 dBm, Ideal DBP at -5 dBm. Trained methods peak in
# between, so training sits at the middle of that interval. CONFIRM before a long run.
training power [dBm] = -5.5
