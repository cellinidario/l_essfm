# Scenario 7: 15 x 80 km long-haul, 32 GBaud, n=2 (digital os).
# Middle member of the 15 x 80 km family (10 / 32 / 93 GBaud share this link),
# so the three scenarios give a clean SNR-vs-symbol-rate comparison.
#
# System values from ldbp2/config/new_test2.ini, the config Dario used for the
# forward. The forward was generated there and copied to
# forward/forward_scenario_15x80km_32GBd.npy: 20 powers, arange(-2, 0, 0.1) dBm,
# one realization each, after a coarse arange(-4, 2, 1) dBm sweep.
[system parameters]
span length [km] = 80
alpha [dB/km] = 0.2
D [ps/nm/km] = 17
gamma [1/W/km] = 1.27
amplifier noise figure [dB] = 4.5
number of polarizations = 2
number of spans = 15
symbol rate [Gbaud] = 32
modulation = 64-QAM
RRC roll-off = 0.05
RRC delay = 510
data symbols per block = 262144
low-pass filter bandwidth [GHz] = 35
analog oversampling = 7
digital oversampling = 2
number of channels = 5
channel spacing [GHz] = 35
[L-ESSFM parameters]
step size method = linear
split step method = symmetric
combine half-steps = yes
steps per span = 3
optimize lengths = yes
tied Kerr parameters = no
# Floor value only: the trainer derives the per-Ns length from nlpr_length()
# (7 at one step per span for n=1.125, 14 for n=2).
nl filter length = 8
# nl alpha: at TEST/apply time this MUST be 1 (the saved NLPR filter is already
#   the physical filter = trained_var/nl_alpha_train). During TRAINING a larger
#   value (e.g. 15) better conditions the gradients (rebalances variable scales);
#   the training step sets it internally. Do NOT set this to the training value here.
nl alpha = 1.0
[training]
minibatch size = 100
optimizer = adam
summary writing interval = 100
save results to file = yes
[data generation]
# Dario's value for this scenario (ldbp2/config/new_test2.ini).
forward steps per span = 180
number of queue elements = 50000
generation batch size = 10
number of parallel processors = 24
data replication factor = 150
minimum elements after dequeue = 2000
forward step size method = logarithmic
forward split step method = symmetric
# Measured on Dario's sweep: EDC peaks at -1.6 dBm, Ideal DBP at -1.3 dBm. Training
# sits between the two, as in scenario 06. (The earlier extrapolation from the 10 and
# 93 GBaud optima gave -1.0 dBm, about 0.5 dB high.)
training power [dBm] = -1.4
